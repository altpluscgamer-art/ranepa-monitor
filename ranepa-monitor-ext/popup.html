<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         width: 400px; margin: 0; padding: 10px; font-size: 13px; color: #222; }
  h1 { font-size: 15px; margin: 4px 0 8px 0; }
  #meta { color: #777; margin-bottom: 8px; }
  #hist { margin: 2px 0 10px 0; }
  .histcap { font-size: 11px; color: #888; margin-bottom: 4px; }
  #hist svg { display: block; }
  .row { display: flex; align-items: center; gap: 6px;
         padding: 5px 8px; border-bottom: 1px solid #eee; }
  .row.ok .code { color: #1a7f37; font-weight: 600; }
  .row.warn .code { color: #9a6700; font-weight: 600; }
  .row.fail .code { color: #c62828; font-weight: 600; }
  .row.fail .name { color: #c62828; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lat { color: #999; font-size: 11px; white-space: nowrap; }
  .code { white-space: nowrap; }
  .chk { border: 1px solid #2f6fed; border-radius: 10px; color: #2f6fed;
         background: #fff; font-size: 11px; line-height: 16px; padding: 0 7px;
         cursor: pointer; flex-shrink: 0; }
  .chk:hover { background: #eef4ff; }
  .chk:disabled { opacity: 0.4; cursor: default; }
  #btns { margin-top: 10px; display: flex; gap: 8px; }
  #openbtn, #refbtn { padding: 8px 12px; border: 0; border-radius: 8px;
             font-size: 13px; cursor: pointer; }
  #openbtn { background: #2f6fed; color: #fff; }
  #openbtn:hover { background: #2059c8; }
  #refbtn { background: #eef1f6; color: #333; }
  #refbtn:hover { background: #dde4ef; }
</style>
</head>
<body>
<h1>Мониторинг сервисов РАНХиГС</h1>
<div id="meta">Загрузка...</div>
<div id="hist"></div>
<div id="list"></div>
<div id="btns">
  <button id="refbtn">Обновить</button>
  <button id="openbtn">Полная страница</button>
</div>
<script src="popup.js"></script>
</body>
</html>
